services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./student_api_alerts.yml:/etc/prometheus/student_api_alerts.yml:ro
    networks:
      - mlops-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mlops-monitoring

networks:
  mlops-monitoring:
    name: mlops-monitoring
