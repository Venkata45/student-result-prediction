name: Student Result Prediction - Kubernetes CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: venkata45/student-result-prediction

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create immutable image reference
        id: image
        run: |
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for testing
        run: |
          docker build -t student-result-prediction:test .

      - name: Start test container
        run: |
          docker run -d --name student-result-test \
            -p 8000:8000 student-result-prediction:test

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "Container health test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-test
          exit 1

      - name: Run existing automated tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
          pytest -q

      - name: Stop test container
        if: always()
        run: docker rm -f student-result-test || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Tag tested image
        run: |
          docker tag student-result-prediction:test \
            ${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}
          docker tag student-result-prediction:test \
            ${REGISTRY}/${IMAGE_NAME}:latest

      - name: Push tested image to GHCR
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}
          docker push ${REGISTRY}/${IMAGE_NAME}:latest

  deploy-kubernetes:
    needs: build-test-push
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Show current deployment image
        run: |
          kubectl get deployment student-result-prediction \
            -o jsonpath="{.spec.template.spec.containers[0].image}"
          echo ""

      - name: Ensure image is available in Minikube
        run: |
          docker build -t ${{ needs.build-test-push.outputs.image_ref }} .
          minikube image load ${{ needs.build-test-push.outputs.image_ref }} --overwrite

      - name: Deploy the tested image
        run: |
          kubectl set image deployment/student-result-prediction \
            student-result-api=${{ needs.build-test-push.outputs.image_ref }}

      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status deployment/student-result-prediction \
            --timeout=180s

      - name: Verify health through the Kubernetes Service
        run: |
          for i in {1..15}; do
            if kubectl exec deployment/student-result-prediction -- python -c "import urllib.request; print(urllib.request.urlopen('http://student-result-prediction-service/health', timeout=10).read().decode())"; then
              echo "Service health verification passed"
              exit 0
            fi
            echo "Waiting for service endpoints to stabilize..."
            sleep 3
          done
          exit 1

      - name: Show deployed image and Pods
        run: |
          kubectl get deployment student-result-prediction -o wide
          kubectl get pods -o wide

      - name: Roll back if deployment verification fails
        if: failure()
        run: |
          kubectl rollout undo deployment/student-result-prediction
          kubectl rollout status deployment/student-result-prediction \
            --timeout=180s
